services:
  dashboard:
    build: .
    container_name: boxtech-dashboard
    restart: unless-stopped
    # Bound to localhost only — nginx is the sole public entry point.
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
